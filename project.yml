name: Biblioteca
options:
  bundleIdPrefix: com.tsevis
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Biblioteca:
    type: application
    platform: macOS
    sources: [Biblioteca]
    info:
      path: Biblioteca/Resources/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: [pdf, epub, mobi, prc, azw, djvu, djv, fb2, cbz, xps, oxps, txt, docx, rtf, html, htm]
    settings:
      base:
        PRODUCT_NAME: biblioteca
        PRODUCT_BUNDLE_IDENTIFIER: com.tsevis.biblioteca
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: biblioteca
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Charis Tsevis"
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        # The bundling phase reads the tools from Homebrew, outside the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Bundle MuPDF, DjVuLibre and Tesseract
        script: python3 "$SRCROOT/Scripts/bundle-tools.py" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
        basedOnDependencyAnalysis: false
  BibliotecaTests:
    type: bundle.unit-test
    platform: macOS
    # Hostless: the core sources are compiled into the bundle so a test run
    # never launches the app or opens a window.
    sources: [BibliotecaTests, Biblioteca/Model, Biblioteca/Engines]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Biblioteca:
    build:
      targets:
        Biblioteca: all
        BibliotecaTests: [test]
    test:
      targets: [BibliotecaTests]
